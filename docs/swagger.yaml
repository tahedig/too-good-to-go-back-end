          $ref: '#/definitions/dto.WorkingHourDTO'
        type: array
      working_hours_summary:
        example: شنبه تا چهارشنبه · ۰۸:۰۰ تا ۱۹:۰۰
        type: string
    type: object
  dto.UpdateStoreRequest:
    properties:
      biography:
        example: نانوایی محلی با نان‌های تازه و شیرینی‌های پخت روز.
        type: string
      category_id:
        example: 1
        type: integer
      images:
        items:
          $ref: '#/definitions/dto.StoreImageDTO'
        type: array
      location:
        $ref: '#/definitions/dto.StoreLocationResponse'
      name:
        example: نان صبحگاهی
        type: string
      phone:
        example: "09124550120"
        type: string
      pickup_address:
        example: تهران، خیابان ولیعصر، پلاک ۱۲
        type: string
      pickup_instructions:
        example: تحویل از پیشخوان نانوایی، ورودی خیابان ولیعصر.
        type: string
      working_hours:
        items:
          $ref: '#/definitions/dto.WorkingHourDTO'
        type: array
    type: object
  dto.VerifyOTPRequest:
    properties:
      code:
        example: "123456"
        type: string
      phone:
        example: "09123456789"
        type: string
    type: object
  dto.VerifyOTPResponse:
    properties:
      phone:
        example: "+989123456789"
        type: string
      verified:
        example: true
        type: boolean
    type: object
  dto.WorkingHourDTO:
    properties:
      close_time:
        example: "19:00"
        type: string
      day_name:
        example: saturday
        type: string
      day_name_fa:
        example: شنبه
        type: string
      day_of_week:
        description: 0 = Saturday, 1 = Sunday, ..., 6 = Friday
        example: 0
        type: integer
      is_closed:
        example: false
        type: boolean
      open_time:
        example: "08:00"
        type: string
    type: object
info:
  contact: {}
  description: REST API for the Too Good To Go application.
  title: Too Good To Go API
  version: "1.0"
paths:
  /auth/otp/request:
    post:
      consumes:
      - application/json
      description: Sends an OTP by SMS to the phone number. The code is never returned,
        except as debug_code when OTP_EXPOSE_CODE is enabled outside production.
      parameters:
      - description: Phone number
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RequestOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RequestOTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: OTP_RESEND_TOO_SOON or TOO_MANY_REQUESTS; see Retry-After
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Request a one-time password
      tags:
      - auth
  /auth/otp/verify:
    post:
      consumes:
      - application/json
      description: Checks the code and consumes it on success. A malformed code is
        rejected without using up an attempt.
      parameters:
      - description: Phone number and code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.VerifyOTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: OTP_ATTEMPTS_EXCEEDED or TOO_MANY_REQUESTS
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Verify a one-time password
      tags:
      - auth
  /favorites/offers:
    get:
      description: لیست علاقه‌مندی‌ها، جدیدترین اول. فقط آفرهایی که همین الان قابل
        خرید هستند نمایش داده می‌شوند.
      parameters:
      - description: User latitude (fills distance)
        in: query
        name: lat
        type: number
      - description: User longitude
        in: query
        name: lng
        type: number
      - default: 20
        description: Page size
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: next_cursor of the previous page
        in: query
        name: cursor
        type: string
      - description: 'DEV auth: users.id'
        in: header
        name: X-Dev-User-Id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CatalogueOfferList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: My favorite offers
      tags:
      - favorites
  /favorites/offers/{id}:
    delete:
      description: حذف از علاقه‌مندی. idempotent است و همیشه ۲۰۴ برمی‌گرداند (وجود
        یا عدم وجود آفر لو نمی‌رود).
      parameters:
      - description: Offer public id (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: 'DEV auth: users.id'
        in: header
        name: X-Dev-User-Id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Remove offer from favorites
      tags:
      - favorites
    put:
      description: 'افزودن به علاقه‌مندی. idempotent است: تکرار درخواست خطا نمی‌دهد.
        {id} همان public id آفر است. آفر ناشناس یا غیرقابل‌نمایش ۴۰۴ می‌دهد.'
      parameters:
      - description: Offer public id (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: 'DEV auth: users.id'
        in: header
        name: X-Dev-User-Id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FavoriteOfferResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Add offer to favorites
      tags:
      - favorites
  /health:
    get:
      description: 200 when the service and all its dependencies are healthy, 503
        otherwise (including during shutdown).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/dto.HealthResponse'
      summary: Service health
      tags:
      - system
  /home/categories:
    get:
      description: دسته‌بندی‌های صفحه اصلی.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HomeCategoriesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Home category shortcuts
      tags:
      - home
  /home/last-chance:
    get:
      description: 'آخرین فرصت‌های نجات غذا: حداکثر ۳ عدد باقی‌مانده یا پایان بازه
        تحویل تا ۲ ساعت دیگر؛ زودترین پایان اول.'
      parameters:
      - description: User latitude (fills distance)
        in: query
        name: lat
        type: number
      - description: User longitude
        in: query
        name: lng
        type: number
      - default: 10
        description: Items per call
        in: query
        maximum: 30
        minimum: 1
        name: limit
        type: integer
      - description: next_cursor of the previous call
        in: query
        name: cursor
        type: string
      - description: 'DEV auth: users.id (fills is_favorite)'
        in: header
        name: X-Dev-User-Id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CatalogueOfferList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Last chance to save food
      tags:
      - home
  /home/popular-nearby:
    get:
      description: 'محبوب‌های اطراف شما: داخل شعاع، بیشترین علاقه‌مندی اول، سپس نزدیک‌ترین.
        بدون lat/lng لیست خالی برمی‌گردد (نه خطا).'
      parameters:
      - description: User latitude
        in: query
        name: lat
        type: number
      - description: User longitude
        in: query
        name: lng
        type: number
      - default: 8
        description: Radius in km
        in: query
        maximum: 100
        minimum: 0
        name: radius_km
        type: number
      - default: 10
        description: Items per call
        in: query
        maximum: 30
        minimum: 1
        name: limit
        type: integer
      - description: next_cursor of the previous call
        in: query
        name: cursor
        type: string
      - description: 'DEV auth: users.id (fills is_favorite)'
        in: header
        name: X-Dev-User-Id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CatalogueOfferList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Popular near you
      tags:
      - home
  /home/today:
    get:
      description: 'فرصت‌های خوشمزه امروز: آفرهایی که بازه تحویل‌شان امروز (به وقت
        تهران) شروع می‌شود؛ بیشترین تخفیف اول. هر بار ۱۰ مورد؛ برای «مشاهده همه» next_cursor
        را به عنوان cursor بفرستید.'
      parameters:
      - description: User latitude (fills distance)
        in: query
        name: lat
        type: number
      - description: User longitude
        in: query
        name: lng
        type: number
      - default: 10
        description: Items per call
        in: query
        maximum: 30
        minimum: 1
        name: limit
        type: integer
      - description: next_cursor of the previous call
        in: query
        name: cursor
        type: string
      - description: 'DEV auth: users.id (fills is_favorite)'
        in: header
        name: X-Dev-User-Id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CatalogueOfferList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Today's tasty opportunities
      tags:
      - home
  /offers:
    get:
      description: 'کاتالوگ آفرها با جستجو، فیلتر، مرتب‌سازی و pagination (cursor).
        فقط آفرهای قابل خرید نمایش داده می‌شوند. اگر sort ارسال نشود: با lat/lng نزدیک‌ترین،
        وگرنه جدیدترین. با تغییر فیلتر یا sort باید cursor را از اول شروع کرد.'
      parameters:
      - description: Search text (offer title or store name)
        in: query
        name: q
        type: string
      - collectionFormat: csv
        description: Category ids, e.g. 1,7 (see /home/categories)
        in: query
        items:
          type: integer
        name: category
        type: array
      - description: Top tab
        enum:
        - bakery
        - ready_meal
        - grocery
        in: query
        name: kind
        type: string
      - description: Min price (Toman)
        in: query
        minimum: 0
        name: price_min
        type: integer
      - description: Max price (Toman)
        in: query
        minimum: 0
        name: price_max
        type: integer
      - description: 'RFC3339: delivery window must end after this instant'
        in: query
        name: pickup_from
        type: string
      - description: 'RFC3339: delivery window must start before this instant'
        in: query
        name: pickup_to
        type: string
      - collectionFormat: csv
        description: Hide offers containing ANY of these
        in: query
        items:
          enum:
          - gluten
          - dairy
          - egg
          - peanut
          - nuts
          - soy
          - fish
          - shellfish
          - sesame
          type: string
        name: exclude_allergens
        type: array
      - description: User latitude (fills distance_m)
        in: query
        name: lat
        type: number
      - description: User longitude
        in: query
        name: lng
        type: number
      - description: Only offers within this radius (needs lat & lng)
        in: query
        maximum: 100
        minimum: 0
        name: radius_km
        type: number
      - description: Sort order
        enum:
        - nearest
        - price_asc
        - price_desc
        - newest
        in: query
        name: sort
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: next_cursor of the previous page
        in: query
        name: cursor
        type: string
      - description: 'DEV auth: users.id (fills is_favorite)'
        in: header
        name: X-Dev-User-Id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CatalogueOfferList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Offer catalogue
      tags:
      - offers
  /offers/filters:
    get:
      description: 'گزینه‌های فیلتر: تب‌ها، دسته‌ها، آلرژن‌ها، بازه قیمت آفرهای فعال
        و گزینه‌های مرتب‌سازی.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CatalogueFiltersResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Filter options
      tags:
      - offers
  /offers/map:
    get:
      description: آفرهای اطراف برای نقشه، نزدیک‌ترین اول. lat و lng اجباری است. برای
        یک پین به ازای هر فروشگاه، سمت کلاینت روی store.id گروه‌بندی کنید.
      parameters:
      - description: Map centre latitude (required)
        in: query
        name: lat
        type: number
      - description: Map centre longitude (required)
        in: query
        name: lng
        type: number
      - default: 5
        description: Radius in km
        in: query
        maximum: 100
        minimum: 0
        name: radius_km
        type: number
      - collectionFormat: csv
        description: Category ids
        in: query
        items:
          type: integer
        name: category
        type: array
      - description: Top tab
        enum:
        - bakery
        - ready_meal
        - grocery
        in: query
        name: kind
        type: string
      - default: 100
        description: Max pins
        in: query
        maximum: 300
        minimum: 1
        name: limit
        type: integer
      - description: 'DEV auth: users.id (fills is_favorite)'
        in: header
        name: X-Dev-User-Id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CatalogueMapResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Offers around a point (map)
      tags:
      - offers
  /stores/{id}:
    get:
      description: Returns public store information, schedule, and available food
        offers for eligible stores. Unknown or unavailable stores return 404 without
        exposing private fields.
      parameters:
      - description: Store Public ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PublicStoreResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get public store details and available offers
      tags:
      - stores
  /stores/{id}/offers:
    get:
      description: آفرهای یک فروشگاه با همان فیلترها و cursor کاتالوگ. {id} همان public
        id فروشگاه است. فروشگاه ناشناس یا غیرفعال لیست خالی می‌دهد.
      parameters:
      - description: Store public id (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Search text (offer title)
        in: query
        name: q
        type: string
      - collectionFormat: csv
        description: Category ids
        in: query
        items:
          type: integer
        name: category
        type: array
      - description: Top tab
        enum:
        - bakery
        - ready_meal
        - grocery
        in: query
        name: kind
        type: string
      - description: Min price (Toman)
        in: query
        minimum: 0
        name: price_min
        type: integer
      - description: Max price (Toman)
        in: query
        minimum: 0
        name: price_max
        type: integer
      - description: 'RFC3339: delivery window must end after this instant'
        in: query
        name: pickup_from
        type: string
      - description: 'RFC3339: delivery window must start before this instant'
        in: query
        name: pickup_to
        type: string
      - collectionFormat: csv
        description: Hide offers containing ANY of these
        in: query
        items:
          enum:
          - gluten
          - dairy
          - egg
          - peanut
          - nuts
          - soy
          - fish
          - shellfish
          - sesame
          type: string
        name: exclude_allergens
        type: array
      - description: User latitude (fills distance_m)
        in: query
        name: lat
        type: number
      - description: User longitude
        in: query
        name: lng
        type: number
      - description: Sort order
        enum:
        - nearest
        - price_asc
        - price_desc
        - newest
        in: query
        name: sort
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: next_cursor of the previous page
        in: query
        name: cursor
        type: string
      - description: 'DEV auth: users.id (fills is_favorite)'
        in: header
        name: X-Dev-User-Id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CatalogueOfferList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Offers of one store
      tags:
      - offers
  /vendor/store-requests:
    get:
      consumes:
      - application/json
      description: Retrieves all store creation/branch requests submitted by the authenticated
        vendor.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.StoreRequestListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List vendor store requests
      tags:
      - vendor
    post:
      consumes:
      - application/json
      description: Submits a request to create a new store or branch.
      parameters:
      - description: Store creation request payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateStoreRequestInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.StoreRequestResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Submit a new store request
      tags:
      - vendor
  /vendor/store-requests/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves status and details of a store creation request.
      parameters:
      - description: Store Request Public ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.StoreRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get store request details
      tags:
      - vendor
  /vendor/stores:
    get:
      consumes:
      - application/json
      description: Retrieves all stores owned by the authenticated vendor.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.StoreListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List vendor stores
      tags:
      - vendor
  /vendor/stores/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves store information for a store owned by the authenticated
        vendor.
      parameters:
      - description: Store Public ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.StoreResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get vendor store details
      tags:
      - vendor
    patch:
      consumes:
      - application/json
      description: Updates editable fields (name, pickup address, category, phone,
        biography, instructions, working hours, images, location) for a store owned
        by the authenticated vendor.
      parameters:
      - description: Store Public ID
        in: path
        name: id
        required: true
        type: string
      - description: Store update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateStoreRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.StoreResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update vendor store information
      tags:
      - vendor
securityDefinitions:
  BearerAuth:
    description: 'Enter your JWT as: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
