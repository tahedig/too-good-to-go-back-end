      pickup_address:
        example: تهران، خیابان ولیعصر، پلاک ۱۲
        type: string
      pickup_instructions:
        example: تحویل از پیشخوان نانوایی، ورودی خیابان ولیعصر.
        type: string
      pickup_summary:
        example: ۳ موجود · تحویل امروز ۱۸:۰۰-۱۹:۰۰
        type: string
      status_badge:
        example: باز است
        type: string
      working_hours_schedule:
