        type: string
      category_name:
        example: نانوایی
        type: string
      category_slug:
        example: bakery
        type: string
      currency:
        example: تومان
        type: string
      discount_percent:
        example: 60
        type: integer
      distance_m:
        example: 600
        type: integer
      distance_text:
        example: ۰.۶ کیلومتر
        type: string
      id:
        example: 7d0c2a3e-1f5b-4a52-8c64-2f4e9b1a0c33
        type: string
      image_url:
        type: string
      is_favorite:
        example: false
        type: boolean
      original_price:
        example: 100000
        type: integer
      pickup_end:
        type: string
      pickup_start:
        type: string
      pickup_window:
