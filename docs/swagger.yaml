  dto.RequestOTPResponse:
    properties:
      debug_code:
        description: DebugCode is present only when OTP_EXPOSE_CODE=true (never in
          production).
        example: "123456"
        type: string
      expires_in_seconds:
        example: 300
        type: integer
      message:
        example: verification code sent
        type: string
    type: object
  dto.StoreImageDTO:
    properties:
      id:
        example: img-1
        type: string
      is_primary:
        example: true
        type: boolean
      sort_order:
        example: 1
        type: integer
      url:
        example: https://example.com/store.jpg
        type: string
