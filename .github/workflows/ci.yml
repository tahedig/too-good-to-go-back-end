name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  branch-validation:
    name: Branch validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate source branch name
        run: python3 scripts/validate_branch_name.py "${{ github.head_ref }}"

  commit-validation:
    name: Commit message validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate every PR commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import urllib.request

          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          repo = os.environ["GITHUB_REPOSITORY"]
          pr_number = event["pull_request"]["number"]
          url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}/commits"
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "backend-ci",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              commits = json.load(response)

          failures = []
          for item in commits:
              message = (item.get("commit", {}).get("message") or "").strip()
              if not message or message.startswith("Merge "):
                  continue

              sha = item.get("sha", "unknown")
              result = subprocess.run(
                  ["python3", "scripts/validate_commit_message.py", "--message", message],
                  capture_output=True,
                  text=True,
              )
              if result.returncode != 0:
                  failures.append({
                      "sha": sha,
                      "message": message,
                      "error": (result.stderr or result.stdout).strip(),
                  })

          if failures:
              print("Commit validation failed for the pull request:", file=sys.stderr)
              for failure in failures:
                  print(f"- {failure['sha']}: {failure['message']}", file=sys.stderr)
                  print(failure["error"], file=sys.stderr)
              raise SystemExit(1)

          print(f"Validated {len(commits)} PR commit(s).")
          PY

  gofmt:
    name: Go formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        run: |
          files=$(git ls-files '*.go')
          if [ -n "$files" ]; then
            output=$(gofmt -l $files)
            if [ -n "$output" ]; then
              echo "$output"
              echo "Go files are not formatted. Run 'gofmt -w' on the files above."
              exit 1
            fi
          fi

  golangci-lint:
    name: Go linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint Go sources
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4.0
          args: --timeout=5m

  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

  go-build:
    name: Go build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Go backend
        run: go build ./...